[project]
name = "bridgic-agent"
# Single source of truth: `src/__init__.py::__version__`. It is the version the
# daemon actually reports over `/api/gateway/health`
# (src/amphi_service/_app.py::__version__ -> line 185/218), and the desktop
# release manifest compares against exactly that value. A second static literal
# here would drift silently and then block every GUI at the compatibility gate
# while CI stayed green — see tests/test_release_version_contract.py.
dynamic = ["version"]
description = "Bridgic Agent — a general-purpose agent built on the Bridgic Amphibious framework."
readme = "README.md"
requires-python = ">=3.10,<3.14"
# SPDX expression, not `{ file = "LICENSE" }`. The table form makes the build
# backend inline the whole 34 KB licence text into the wheel's `License:`
# metadata field — a 60 KB METADATA whose licence is unreadable to any tool
# that expects an identifier. The expression is machine-readable and the text
# still ships, as `License-File`, via `license-files` below.
#
# `-only`, not `-or-later`: README, NOTICE and the desktop About page all say
# "AGPL v3.0" and nothing in the repository elects a later version. Changing
# that election is a licensing decision, so it stays where it can be seen.
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "BitSky-Tech Inc." }]
dependencies = [
    "bridgic-amphibious==0.2.0",
    "bridgic-core>=0.3.0",
    "bridgic-llms-openai>=0.1.3",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0",
    "markdown-it-py>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.44",
    "python-multipart>=0.0.9",
    "httpx[http2]>=0.27",
    "brotli>=1.1.0",
    "beautifulsoup4>=4.12",
    "websockets>=14.0",
    "sqlmodel>=0.0.16",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "filelock>=3.13",
    "bridgic-browser==0.0.5",
    "google-genai>=2.8.0",
    "dulwich>=1.2.6",
    "croniter>=6.2.4",
]

# `amphi` is the single user-facing entry point; it forwards into
# src.amphi_cli.dispatch which then routes to `server` / `agent` /
# `serve` subcommands.
[project.urls]
Homepage = "https://github.com/bitsky-tech/bridgic-agent"
Repository = "https://github.com/bitsky-tech/bridgic-agent"
Issues = "https://github.com/bitsky-tech/bridgic-agent/issues"

[project.scripts]
amphi = "src.amphi_cli:dispatch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pyinstaller>=6.0",
    "requests>=2.34.2",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "process: tests that launch the real application in a child process",
    "live: tests that contact a real external provider (explicit opt-in required)",
    "windows_runtime: backend runtime contracts that must also pass on native Windows",
]

[tool.coverage.run]
# SQLAlchemy's async engine runs DB I/O inside greenlets; without this,
# coverage.py can't trace code executed across greenlet switches and
# under-reports every repository/handler body that opens a DB session.
concurrency = ["greenlet"]
