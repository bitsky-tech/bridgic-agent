appId: ai.bridgic.agent
productName: Bridgic Agent
copyright: Copyright © 2026 BitSky-Tech Inc.

# electronVersion is deliberately NOT pinned here. electron-builder falls back to
# the version installed under node_modules/electron, which is the one `bun run
# dev` actually runs — so dev and the shipped package can never diverge.
#
# The pin used to say 39.2.7 while node_modules resolved `^39.2.7` to 39.8.10:
# six patch releases apart, meaning every local dev session exercised a build no
# user would ever get, and nothing anywhere reported the mismatch. A hard-coded
# version re-introduces that drift the next time the caret range moves.

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  # dist/resources/ is a DEV-ONLY mirror of resources/ (see
  # scripts/electron-build-resources.ts — the dev build expects assets next to
  # main.cjs). Packaging never reads from it: icons come from mac.icon/win.icon
  # (which point at resources/, not dist/), and the heavy payloads (bin,
  # uv_runtime, python_runtime, node_runtime, the NSIS EnVar plugin) are supplied by
  # extraResources / buildResources below. So the whole mirror is dead weight
  # that also doubles what Apple's notary service has to scan — exclude it
  # wholesale rather than enumerating subtrees (the enumerated form silently
  # missed source/, systemd/, x86-unicode/ and the icon set).
  - "!dist/resources/**"
  - "!dist/renderer/src/**"
  - "!**/*.map"
  - package.json

# Bundle the backend (`amphi`) PyInstaller bundle into Resources/bin/.
# `scripts/prebuild-fetch-amphi.ts` populates resources/bin/ before this
# config is consulted; main-process path-resolver.ts looks for the
# binary under `process.resourcesPath/bin/amphi` at runtime.
#
# The filter MUST stay `**/*`. It was `amphi*` while the CLI was a PyInstaller
# ONEFILE build — one self-contained executable, so matching its name sufficed.
# The build is onedir now (see build/amphi.spec): the launcher ships beside an
# `_internal/` payload directory, and `_internal` does not match `amphi*`, so
# that filter silently shipped a launcher with no payload — it installed fine
# and then failed to run at all. Verified on Windows 11, 2026-07-28.
# prebuild-fetch-amphi.ts wipes and repopulates resources/bin/, so its contents
# are exactly the bundle; there is nothing here that needs excluding.
extraResources:
  # Generated by scripts/release-manifest.ts before every main/preload/renderer
  # build. Declares which backend version THIS GUI was released against; the main
  # process compares it with whatever daemon it adopts and blocks the UI on a
  # mismatch instead of talking to a stale daemon over an incompatible contract.
  # Must live outside the asar so packaged main code can read it from
  # process.resourcesPath.
  - from: resources/release-manifest.json
    to: release-manifest.json
  # Compliance set, staged into resources/ by scripts/gen-third-party-licenses.ts
  # (which runs as part of `bun run build`, so it is always current with whatever
  # this build actually bundled). They ship UNPACKED, beside the app rather than
  # inside the asar: MIT's "shall be included in all copies", Apache-2.0 §4 and
  # OFL-1.1 §2 are all satisfied either way, but a user who wants to read what
  # they installed should not have to run `npx asar extract` to do it.
  #
  # All three or none — THIRD-PARTY-LICENSES.txt cites NOTICE, NOTICE cites
  # THIRD-PARTY-LICENSES.txt, and LICENSE condition 1 requires the license to
  # travel with any redistribution. The generator aborts the build if any is
  # missing, which is the guard against the failure this pair already had once:
  # a NOTICE citing a THIRD-PARTY-LICENSES.txt that no build ever produced.
  - from: resources/THIRD-PARTY-LICENSES.txt
    to: THIRD-PARTY-LICENSES.txt
  - from: resources/LICENSE
    to: LICENSE
  - from: resources/NOTICE
    to: NOTICE
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/uv_runtime
    to: uv_runtime
    filter:
      - "**/*"
  - from: resources/python_runtime
    to: python_runtime
    filter:
      - "**/*"
  # Node 22 LTS (~40 MB compressed). Serves two consumers that previously had
  # no runtime at all: Playwright's driver (pointed here via
  # PLAYWRIGHT_NODEJS_PATH, which let us drop its own 37 MB vendored copy from
  # the amphi binary) and the npm/npx-dependent Skills (docx, pptx, remotion,
  # hyperframes) — the daemon runs under launchd with a minimal PATH, so a
  # user's own Node is invisible to it. See
  # src/amphi_agent/runtime/_node_env.py::BundledNodeRuntime and
  # scripts/prebuild-fetch-node.ts.
  - from: resources/node_runtime
    to: node_runtime
    filter:
      - "**/*"
# No standalone browser binary is shipped. Built-in browser tools attach the
# Playwright driver to Electron's Chromium through the registered embedded
# controller; without that controller they fail explicitly instead of launching
# or downloading another browser.

# afterPack: macOS Python binary codesigning + Windows / Linux integrity
# checks. The script is a no-op when no signing identity is available
# so local dev builds keep working without certificates.
afterPack: build/after-pack.cjs

extraMetadata:
  main: dist/main.cjs

# Auto-update — point at any static host that serves
# latest.yml / latest-mac.yml / latest-linux.yml.
# Replace this placeholder with your real release URL before shipping; the
# main process auto-update flow is gated on `APP_UPDATE_URL` at runtime, so
# leaving the placeholder is safe for local builds (no update check fires).
publish:
  provider: generic
  url: https://example.com/updates

# asar: true packs the app source (dist/**) into one archive instead of
# thousands of loose files. This directly cuts Apple's notary scan time (the
# notarize-stall this repo hit was driven by file count, not just bytes) and
# speeds cold start. `false` here was only the electron-bun-template default —
# no commit, issue, or comment ever justified it.
#
# No asarUnpack whitelist is needed. Everything that requires a physical on-disk
# path is already OUTSIDE the asar, in extraResources (Contents/Resources/):
# the amphi binary (execFile'd via process.resourcesPath), uv_runtime,
# python_runtime, node_runtime, and updater_tools. Inside the app there are zero
# native .node modules. preload + renderer load through Electron's native asar
# support. The two getAppPath()/resources/icon.png reads are both dev-only
# (guarded by !app.isPackaged).
#
# The main process DOES spawn bundled binaries and read bundled files —
# `updater_tools/{7za,app-builder}` and `app-update.yml`, all via
# `process.resourcesPath` (see main/rebuild-update-zip.ts). That is exactly why
# they live in extraResources: an asar path is not a real path, so anything
# execFile'd or read with fs must stay outside. Adding such a consumer without
# putting its target here is what this note exists to prevent.
asar: true

# Custom URL scheme — lets the Codex OAuth success page (and any deep link)
# launch the app via `amphi://…`. electron-builder writes this into the macOS
# Info.plist (CFBundleURLTypes) and the Windows NSIS registry. Must match the
# scheme registered at runtime via setAsDefaultProtocolClient (see index.ts).
protocols:
  # `name` is display text (CFBundleURLName); `schemes` is the wire identifier
  # and stays `amphi` — renaming it would break every already-registered deep
  # link and the backend's mirrored APP_SCHEME.
  - name: Bridgic Agent
    schemes:
      - amphi

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  target:
    # pkg is the ONLY user-facing installer: its postinstall registers the
    # launchd LaunchAgent (keeps the daemon alive for unattended scheduling)
    # and symlinks the amphi CLI into PATH. dmg was dropped — a drag-install
    # gives you an app whose scheduler dies the moment you quit the GUI (no
    # LaunchAgent), which reads as broken — so pkg is the only clean path.
    - pkg
    # zip is NOT a user download — electron-updater requires it for macOS
    # auto-update (it can't apply a pkg/dmg delta). Kept even though
    # publish.url is still a placeholder, so enabling updates later is a
    # one-line change, not a repackage.
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # ${version} is REQUIRED, not cosmetic. electron-updater's generic provider
  # builds its download URL as `${publish.url}/${path}`, where `path` comes from
  # latest*.yml. A fixed filename means one origin can only ever host a single
  # release: publishing 0.2.0 overwrites 0.1.0, so rollback and staged rollout
  # are both impossible and an interrupted upload corrupts the current release.
  # Literal, NOT `${productName}`: the display name is "Bridgic Agent" and the
  # space would land in every artifact filename and therefore in the update
  # feed's download URL. Keep the slug hyphenated here.
  artifactName: "Bridgic-Agent-${version}-${arch}.${ext}"
  # Code signing & notarization — set CSC_LINK, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
  # APPLE_TEAM_ID env vars to enable. Unsigned builds work for local development.
  # Staged by scripts/prebuild-updater-tools.ts, which only the `dist:mac*`
  # scripts run — hence a platform-level `extraResources` rather than a
  # top-level one. Platform entries are APPENDED to the global list
  # (fileMatcher.js: addPatterns(config[name]) then
  # addPatterns(customBuildOptions[name])), so this does not replace anything
  # above.
  #
  # macOS-only on purpose. These two binaries let the app rebuild the
  # `<cacheDir>/update.zip` that electron-updater needs as a differential
  # source but that a .pkg install never produces — without them the first
  # update after a fresh install downloads 222 MB instead of 24 MB. Windows
  # needs no equivalent: its NSIS installer already copies itself to
  # `%LOCALAPPDATA%\amphi-updater\installer.exe` at install time, verified on a
  # real machine (0.1.1→0.1.2 pulled 8,120 KB, 4%).
  extraResources:
    - from: resources/updater_tools
      to: updater_tools
      filter:
        - "**/*"

pkg:
  # Path is resolved against `directories.buildResources` (i.e. resources/), NOT
  # the project dir — app-builder-lib/out/targets/pkg.js does a bare
  # `path.resolve(buildResourcesDir, options.scripts)` with no fallback, so a
  # wrong path is skipped SILENTLY: the pkg builds fine, just without a Scripts
  # entry, and postinstall never runs (no launchd agent, no /usr/local/bin/amphi).
  # `nsis.include` looks similar but goes through packager.getResource(), which
  # DOES fall back to the project dir — which is why only macOS was affected.
  # Verify after changing: `pkgutil --expand <pkg> /tmp/x && ls /tmp/x/*/Scripts`
  scripts: ../build/pkg-scripts
  installLocation: /Applications
  allowAnywhere: false       # Force install to /Applications so postinstall
                              # symlink paths are predictable.
  allowCurrentUserHome: false
  isRelocatable: false

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Literal, NOT `${productName}`: the display name is "Bridgic Agent" and the
  # space would land in every artifact filename and therefore in the update
  # feed's download URL. Keep the slug hyphenated here.
  artifactName: "Bridgic-Agent-${version}-${arch}.${ext}"
  # Windows artifacts are not Authenticode-signed; CI has no signing certificate configured.
  #
  # This flag has a one-way door built into it: whenever it is not `false`,
  # electron-builder writes the signing certificate's publisher name into the
  # packaged app-update.yml (PublishManager.js:202-206), and electron-updater
  # reads that file from the *currently installed* build to decide whether the
  # downloaded installer is trustworthy (NsisUpdater.js:85-99). So a release that
  # ever shipped a publisherName can never be rescued by flipping this flag in a
  # LATER release — those clients are already committed to verifying, and a lost
  # or rotated certificate strands them on ERR_UPDATER_INVALID_SIGNATURE with a
  # manual reinstall as the only way out.
  #
  # Ship permissive first, tighten later (never the reverse). Update payloads are
  # still integrity-checked via the sha512 in latest.yml; signature verification
  # is the second lock, not the only one.
  verifyUpdateCodeSignature: false
  # publisherName: deliberately unset — setting it is what turns verification on.

nsis:
  # Assisted (wizard) installer. The directory page is NOT electron-builder's:
  # see build/installer.nsh's customPageAfterChangeDir for why we insert our own.
  oneClick: false
  # Per-user install to %LOCALAPPDATA%\Programs\ (not Program Files) so the app
  # can read/write files without elevated permissions.
  perMachine: false
  # With oneClick:false and perMachine:false, electron-builder inserts an
  # install-mode page (assistedInstaller.nsh:19) whose "for all users" option
  # triggers UAC and installs into Program Files — which breaks the entire HKCU
  # model (daemon autostart Run key, user PATH, ~/.bridgic). Turning elevation
  # off removes the option; installer.nsh's customInstallMode additionally forces
  # the current-user branch so the page is skipped outright.
  allowElevation: false
  # Left false ON PURPOSE. electron-builder's own directory page is skipped only
  # when ${isUpdated} is set, and that flag means "the installer was launched
  # with --updated", which only electron-updater ever passes
  # (nsisScriptGenerator.js:27-37, electron-updater NsisUpdater.js:107). A user
  # double-clicking a newer .exe over an existing install does not set it, so the
  # stock page would happily relocate an existing installation. installer.nsh
  # inserts its own page gated on a snapshot taken in customInit instead.
  allowToChangeInstallationDirectory: false
  multiLanguageInstaller: true
  installerLanguages: [en_US, zh_CN]
  # No language picker: electron-builder selects a bundled installer language
  # from the Windows UI language automatically and falls back to English. The
  # renderer's own locale preference is deliberately NOT consulted — at first
  # install it does not exist yet.
  displayLanguageSelector: false
  # Deletes `%APPDATA%\Bridgic Agent` (Electron userData) only on a real
  # user-initiated uninstall — uninstaller.nsh:223-240 guards it with
  # ${ifNot} ${isUpdated}, and an over-install always passes --updated
  # (installUtil.nsh:200-206). It has never touched ~/.bridgic, which is where
  # the daemon keeps user data.
  #
  # Two different names are at play and they must not be confused. What the
  # uninstaller DELETES is `$APPDATA\${APP_FILENAME}` plus
  # `$APPDATA\${APP_PACKAGE_NAME}` (uninstaller.nsh:237,243) — i.e. the
  # build-time sanitized `productName` above, and package.json's `name`
  # (`amphi`). What the app WRITES is `app.getPath('userData')`, a runtime value
  # derived from `app.setName()` (index.ts: `process.env.APP_NAME ||
  # APP_PRODUCT_NAME`). They coincide only while APP_NAME is unset — which is
  # why .env.example deliberately no longer sets it. Set it, and the uninstaller
  # cleans a directory the app never wrote while the real profile survives.
  #
  # The 2026-08 rename moved both off `Amphi`. Only Electron-owned state
  # (localStorage / cache) lived there — GUI settings are in
  # `~/.bridgic/amphi/` — so no migration was written; a pre-rename install
  # leaves the old directory behind for the user to delete.
  deleteAppDataOnUninstall: true
  include: build/installer.nsh   # PATH + autostart + lifecycle preflight

linux:
  icon: resources/icon.png
  category: Utility
  target:
    # deb only: its postinst installs the systemd --user unit that keeps the
    # daemon alive for unattended scheduling. AppImage was dropped — it has no
    # install hook, so (like the removed macOS dmg) its scheduler would die on
    # GUI quit — so deb is the only clean path.
    - target: deb
      arch: [x64]
  # See the mac artifactName comment: the update feed addresses artifacts by
  # filename, so it has to carry the version.
  # Literal, NOT `${productName}`: the display name is "Bridgic Agent" and the
  # space would land in every artifact filename and therefore in the update
  # feed's download URL. Keep the slug hyphenated here.
  artifactName: "Bridgic-Agent-${version}-${arch}.${ext}"

deb:
  afterInstall: build/deb-scripts/postinst
  afterRemove: build/deb-scripts/postrm
